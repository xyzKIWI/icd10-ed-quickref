name: Check ICD-10 build and search
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python src/restore_build.py
      - run: python src/test_data.py
      - run: node src/test_search.js
      - run: node src/test_safety.js
      - run: node --test src/test_ui.js
      - run: python src/build_html.py
